<div class="login-page">
  <div class="login-card">
    <div class="card-accent" aria-hidden="true"></div>

    <div class="brand-lockup">
      <div class="brand-icon" aria-hidden="true">C</div>
      <div class="brand-copy">
        <h1>Cashew ERP</h1>
        <p>Factory Suite</p>
      </div>
    </div>

    <div class="card-header">
      <span class="eyebrow">Secure Access</span>
      <h2>Welcome back</h2>
      <p>Sign in to manage procurement, processing, inventory, and sales from one workspace.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <div class="field-group">
        <label class="field-label" for="email">Email / Username</label>
        <div class="input-shell" [class.invalid]="emailControl?.invalid && emailControl?.touched">
          <mat-icon>person</mat-icon>
          <input id="email" type="text" formControlName="email" placeholder="Enter email or username" autocomplete="username" />
        </div>
        <p class="field-error" *ngIf="emailControl?.invalid && emailControl?.touched">Email is required</p>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="input-shell" [class.invalid]="passwordControl?.invalid && passwordControl?.touched">
          <mat-icon>lock</mat-icon>
          <input
            id="password"
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-visibility"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          >
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </div>
        <p class="field-error" *ngIf="passwordControl?.invalid && passwordControl?.touched">Password is required</p>
      </div>

      <div class="form-meta">
        <mat-checkbox formControlName="rememberMe" color="primary">Remember Me</mat-checkbox>
        <a class="forgot-link" href="" (click)="$event.preventDefault()">Forgot Password?</a>
      </div>

      <p class="auth-error" *ngIf="authError">{{ authError }}</p>

      <button type="submit" class="login-button" [disabled]="isSubmitting">
        <mat-spinner *ngIf="isSubmitting" diameter="20"></mat-spinner>
        <span>{{ isSubmitting ? 'Signing in...' : 'Login' }}</span>
      </button>

      <p class="helper-text">Use <strong>admin</strong> / <strong>admin</strong> for the mock login flow.</p>
    </form>
  </div>
</div>
