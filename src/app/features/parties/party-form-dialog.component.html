<section class="dialog-shell" [formGroup]="partyForm">
  <header class="dialog-header">
    <div>
      <h2>{{ dialogTitle }}</h2>
      <p>Use one shared party workflow for vendors and buyers.</p>
    </div>

    <button mat-icon-button type="button" aria-label="Close dialog" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="dialog-body">
    <section class="form-section" *ngFor="let section of sectionConfigs">
      <div class="section-heading">
        <h3>{{ section.title }}</h3>
      </div>

      <div class="field-grid">
        <ng-container *ngFor="let field of section.fields">
          <mat-form-field appearance="outline" class="field" [class.field-full]="field.type === 'textarea'">
            <mat-label>{{ field.label }}</mat-label>

            <ng-container [ngSwitch]="field.type">
              <mat-select *ngSwitchCase="'select'" [formControlName]="field.key">
                <mat-option *ngFor="let option of getOptions(field.key)" [value]="option.value">
                  {{ option.label }}
                </mat-option>
              </mat-select>

              <textarea
                *ngSwitchCase="'textarea'"
                matInput
                rows="3"
                [formControlName]="field.key"
                [placeholder]="field.placeholder || ''"
              ></textarea>

              <input
                *ngSwitchDefault
                matInput
                [type]="field.type"
                [formControlName]="field.key"
                [placeholder]="field.placeholder || ''"
              />
            </ng-container>

            <mat-hint *ngIf="field.hint">{{ field.hint }}</mat-hint>
            <mat-error *ngIf="partyForm.get(field.key)?.invalid && partyForm.get(field.key)?.touched">
              {{ field.label }} is required.
            </mat-error>
          </mat-form-field>
        </ng-container>
      </div>
    </section>

    <section class="form-section">
      <div class="section-heading">
        <h3>Origin</h3>
        <button mat-stroked-button type="button" (click)="addOrigin()">
          <mat-icon>add</mat-icon>
          Add Origin
        </button>
      </div>

      <div class="origin-list" formArrayName="origin">
        <div class="origin-row" *ngFor="let control of originControls.controls; let i = index">
          <mat-form-field appearance="outline" class="field">
            <mat-label>Origin {{ i + 1 }}</mat-label>
            <input matInput [formControlName]="i" placeholder="Kerala" />
            <mat-error *ngIf="control.invalid && control.touched">Origin is required.</mat-error>
          </mat-form-field>

          <button mat-icon-button type="button" aria-label="Remove origin" (click)="removeOrigin(i)">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </section>

    <section class="form-section">
      <div class="section-heading">
        <h3>Notes</h3>
      </div>

      <mat-form-field appearance="outline" class="field field-full">
        <mat-label>Internal Notes</mat-label>
        <textarea matInput rows="3" formControlName="notes" placeholder="Add operational context"></textarea>
      </mat-form-field>
    </section>
  </div>

  <footer class="dialog-actions">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button color="primary" type="button" (click)="submit()">
      {{ isEditMode ? 'Save Changes' : 'Save ' + entityLabel }}
    </button>
  </footer>
</section>
