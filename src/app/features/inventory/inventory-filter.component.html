<section class="card filter-card">
  <div class="filter-row">
    <form class="filters-grid" [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Stage</mat-label>
        <mat-select formControlName="stage">
          <mat-option *ngFor="let option of stageOptions" [value]="option">
            {{ option === 'ALL' ? 'All' : option }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option *ngFor="let option of categoryOptions" [value]="option">
            {{ option === 'ALL' ? 'All' : option === 'BYPRODUCTS' ? 'Byproducts' : option | titlecase }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate" />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search Batch ID</mat-label>
        <input matInput formControlName="search" placeholder="Search by Batch ID" />
      </mat-form-field>
    </form>

    <mat-button-toggle-group [value]="viewMode" (change)="changeViewMode($event.value)">
      <mat-button-toggle value="SUMMARY">Summary View</mat-button-toggle>
      <mat-button-toggle value="LEDGER">Ledger View</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</section>
