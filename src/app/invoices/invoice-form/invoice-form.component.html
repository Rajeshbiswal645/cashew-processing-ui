<h2 mat-dialog-title>{{ isEdit ? 'Edit Invoice' : 'Create Invoice' }}</h2>

<div mat-dialog-content>

  <form [formGroup]="form" class="form-layout">

    <mat-form-field appearance="outline">
      <mat-label>Invoice No</mat-label>
      <input matInput formControlName="invoice_no">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Customer</mat-label>
      <input matInput formControlName="customer">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Invoice Date</mat-label>
      <input matInput type="date" formControlName="invoice_date">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Total Amount</mat-label>
      <input matInput type="number" formControlName="total_amount">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="PAID">PAID</mat-option>
        <mat-option value="PENDING">PENDING</mat-option>
        <mat-option value="OVERDUE">OVERDUE</mat-option>
      </mat-select>
    </mat-form-field>

  </form>

</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">Save</button>
</div>
